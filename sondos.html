 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | LIMU Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f3f4f6;
            color: #1f2937;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-wrap {
            width: 100%;
            max-width: 400px;
        }

        .login-card {
            background: #ffffff;
            padding: 40px 32px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        .login-logo {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background-color: #eff6ff;
            color: #2563eb;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .brand-dot {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 12px;
            height: 12px;
            background-color: #10b981;
            border: 2px solid #ffffff;
            border-radius: 50%;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: 4px;
        }

        .sub {
            font-size: 0.875rem;
            color: #6b7280;
            margin-bottom: 28px;
        }

        .field {
            text-align: left;
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }

        .input {
            width: 100%;
            padding: 10px 14px;
            font-size: 0.95rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            margin-top: 8px;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: #2563eb;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        .demo {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #e5e7eb;
            font-size: 0.8rem;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <main class="login-wrap">
        <section class="login-card">

            <div class="login-logo">
                <!-- أيقونة مكتبة ثابتة (SVG) -->
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
                <i class="brand-dot"></i>
            </div>

            <h1>LIMU Library</h1>
            <p class="sub">Administrator Sign In</p>

            <!-- نموذج HTML ثابت -->
            <form action="#" method="get">

                <div class="field">
                    <label for="username">Username</label>
                    <input
                        class="input"
                        id="username"
                        name="username"
                        type="text"
                        value="admin"
                        required
                    >
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input
                        class="input"
                        id="password"
                        name="password"
                        type="password"
                        value="admin123"
                        required
                    >
                </div>

                <button class="btn btn-primary" type="submit">
                    Sign In
                </button>

            </form>

            <p class="demo">
                Demo account: admin / admin123.
            </p>

        </section>
    </main>

</body>
</html>
