<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book Management | LIMU Library</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body data-page="books">

    <div class="layout"> 


        <aside class="sidebar" id="sidebar"></aside>

        <main class="content">

            <header class="page-header">
                <div>
                    <h1>Book Management</h1>
                    <p>Add, edit, search, and manage library books</p>
                </div>

                <button class="btn btn-primary" id="addBtn">＋ Add Book</button>
            </header>

            <div class="toolbar">
                <input
                    class="input"
                    id="search"
                    placeholder="Search by title, author, category, or ISBN"
                >
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Book ID</th>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Category</th>
                            <th>ISBN</th>
                            <th>Quantity</th>
                            <th>Available</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="rows"></tbody>
                </table>
            </div>

            <!-- Add / Edit Book window -->
            <div class="modal-overlay" id="modal">

                <div class="modal">

                    <h3 id="modalTitle">Add Book</h3>

                    <form id="form" novalidate>

                        <input type="hidden" id="bid">

                        <div class="form-grid">

                            <div class="field">
                                <label for="title">Book Title *</label>
                                <input class="input" id="title">
                            </div>

                            <div class="field">
                                <label for="author">Author *</label>
                                <input class="input" id="author">
                            </div>

                            <div class="field">
                                <label for="category">Category *</label>
                                <input class="input" id="category" list="cats">
                                <datalist id="cats"></datalist>
                            </div>

                            <div class="field">
                                <label for="isbn">ISBN *</label>
                                <input class="input" id="isbn" dir="ltr">
                            </div>

                            <div class="field">
                                <label for="qty">Quantity *</label>
                                <input class="input" id="qty" type="number" min="1" value="1">
                            </div>

                        </div>

                        <p class="hint" id="formErr" style="color:var(--bad); min-height:1.4em"></p>

                        <div class="modal-actions">
                            <button class="btn btn-primary" type="submit">Save</button>
                            <button class="btn btn-ghost" type="button" data-close>Cancel</button>
                        </div>

                    </form>

                </div>

            </div>

        </main>


            
    </div>

    <script src="js/common.js"></script>
    <script src="js/books.js"></script>

</body>
</html>
