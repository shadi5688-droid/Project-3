<!DOCTYPE html>
<html lang="en" dir="ltr">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Return a Book | LIMU Library</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>


<body data-page="return">

    <div class="layout">

        <aside class="sidebar" id="sidebar"></aside>

        <main class="content">

            <header class="page-header">
                <div>
                    <h1>Return a Book</h1>
                    <p>Find a borrowing record and record the return</p>
                </div>
            </header>

            <div class="toolbar">
                <input
                    class="input"
                    id="search"
                    placeholder="Search by member, book title, or borrow ID"
                >
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Borrow ID</th>
                            <th>Member</th>
                            <th>Phone</th>
                            <th>Book</th>
                            <th>Borrow Date</th>
                            <th>Due Date</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="rows"></tbody>
                </table>
            </div>

        </main>

    </div>



    <script src="js/common.js"></script>
    <script src="js/return.js"></script>

</body>
</html>
