<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In | LIMU Library</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body data-page="login">

    <main class="login-wrap">

        <section class="login-card">

            <div class="login-logo">
                <span data-icon="library"></span>
                <i class="brand-dot"></i>
            </div>

            <h1>LIMU Library</h1>
            <p class="sub">Administrator Sign In</p>

            <form id="loginForm" novalidate>

                <div class="field">
                    <label for="username">Username</label>
                    <input class="input" id="username" autocomplete="username" autofocus>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input class="input" id="password" type="password" autocomplete="current-password">
                </div>

                <p class="error" id="err" role="alert"></p>

                <button class="btn btn-primary" type="submit">Sign In</button>

            </form>

            <p class="demo">Demo account: admin / admin123.</p>

        </section>

    </main>

    <script src="js/common.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
