<!DOCTYPE html>

<head>

    <title>Member Management | LIMU Library</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body data-page="members">

    <div class="layout">

        <aside class="sidebar" id="sidebar"></aside>

        <main class="content">

            <header class="page-header">
                <div>
                    <h1>Member Management</h1>
                    <p>Register library members and manage their details</p>
                </div>

                <button class="btn btn-primary" id="addBtn">
                    ＋ Add Member
                </button>
            </header>

            <div class="toolbar">
                <input
                    class="input"
                    id="search"
                    placeholder="Search by name, phone, or email"
                >
            </div>

            <div class="table-wrap">

                <table>
                    <thead>
                        <tr>
                            <th>Member ID</th>
                            <th>Full Name</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Registration Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="rows"></tbody>
                </table>

            </div>

            <div class="modal-overlay" id="modal">

                <div class="modal">

                    <h3 id="modalTitle">Add Member</h3>

                    <!-- Member Form -->
                    <form id="form" novalidate>

                        <input type="hidden" id="mid">

                        <div class="form-grid"> 
 
                            <div class="field">
                                <label for="name">Full Name *</label>
                                <input class="input" id="name">
                            </div>
                            
                            <div class="field">
                                <label for="phone">Phone Number *</label>
                                <input  
                                    class="input"
                                    id="phone"
                                    dir="ltr"
                                    inputmode="tel" 
                                >
                            </div>

                            <div class="field">
                                <label for="email">Email</label>
                                <input
                                    class="input"
                                    id="email"
                                    type="email"
                                    dir="ltr"
                                >
                            </div>

                            <div class="field">
                                <label for="regDate">Registration Date</label>
                                <input class="input" id="regDate" type="date">
                            </div>

                        </div>

                        <p
                            class="hint"
                            id="formErr"
                            style="color:var(--bad);min-height:1.4em"
                        ></p>

                        <div class="modal-actions">

                            <button class="btn btn-primary" type="submit">
                                Save
                            </button>

                            <button class="btn btn-ghost" type="button" data-close>
                                Cancel
                            </button>

                        </div>

                    </form>
                </div>
            </div>

        </main>
    </div>
</body>
</html>
